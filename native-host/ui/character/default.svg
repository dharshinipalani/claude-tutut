<svg class="tutut" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="tutut">
  <!-- Trial tutut: a mint "bunny-bean". Original placeholder — replace with
       your own design by dropping character/tutut.png (or .svg/.gif/.webp). -->
  <defs>
    <radialGradient id="tt-body" cx="38%" cy="28%" r="85%">
      <stop offset="0" stop-color="#f1fff9"/>
      <stop offset="0.45" stop-color="#b5f5dc"/>
      <stop offset="1" stop-color="#4fbf9c"/>
    </radialGradient>
    <radialGradient id="tt-ear" cx="40%" cy="25%" r="90%">
      <stop offset="0" stop-color="#e6fff5"/>
      <stop offset="1" stop-color="#5ccaa7"/>
    </radialGradient>
    <linearGradient id="tt-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc2d1"/>
      <stop offset="1" stop-color="#ff8fab"/>
    </linearGradient>
  </defs>

  <!-- ears (animated separately: perk, twitch, droop) -->
  <g id="ear-left" class="ear ear-left">
    <ellipse cx="41" cy="30" rx="10.5" ry="21" transform="rotate(-16 41 30)" fill="url(#tt-ear)"/>
    <ellipse cx="41" cy="32" rx="5" ry="13" transform="rotate(-16 41 32)" fill="url(#tt-inner)"/>
  </g>
  <g id="ear-right" class="ear ear-right">
    <ellipse cx="79" cy="30" rx="10.5" ry="21" transform="rotate(16 79 30)" fill="url(#tt-ear)"/>
    <ellipse cx="79" cy="32" rx="5" ry="13" transform="rotate(16 79 32)" fill="url(#tt-inner)"/>
  </g>

  <!-- body -->
  <g id="body" class="body">
    <path d="M60 36 C90 36 104 54 104 74 C104 96 86 108 60 108 C34 108 16 96 16 74 C16 54 30 36 60 36 Z"
          fill="url(#tt-body)"/>
    <!-- soft top highlight -->
    <ellipse cx="46" cy="50" rx="15" ry="6" transform="rotate(-14 46 50)" fill="#ffffff" opacity="0.55"/>

    <!-- cheeks + freckles -->
    <ellipse cx="35" cy="84" rx="7" ry="3.6" fill="#ff8fab" opacity="0.45"/>
    <ellipse cx="85" cy="84" rx="7" ry="3.6" fill="#ff8fab" opacity="0.45"/>
    <circle cx="32" cy="80" r="0.9" fill="#e36a8a" opacity="0.7"/>
    <circle cx="36" cy="79" r="0.9" fill="#e36a8a" opacity="0.7"/>
    <circle cx="84" cy="79" r="0.9" fill="#e36a8a" opacity="0.7"/>
    <circle cx="88" cy="80" r="0.9" fill="#e36a8a" opacity="0.7"/>

    <!-- eyes (blink) -->
    <g id="eye-left" class="eye">
      <ellipse cx="46" cy="72" rx="5.2" ry="7.2" fill="#1d2433"/>
      <circle cx="47.8" cy="69.2" r="1.8" fill="#fff"/>
    </g>
    <g id="eye-right" class="eye">
      <ellipse cx="74" cy="72" rx="5.2" ry="7.2" fill="#1d2433"/>
      <circle cx="75.8" cy="69.2" r="1.8" fill="#fff"/>
    </g>

    <!-- mouth -->
    <path id="mouth" class="mouth" d="M55.5 84 q2.25 2.8 4.5 0 q2.25 2.8 4.5 0"
          fill="none" stroke="#1d2433" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
